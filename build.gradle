plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.99'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Add your repositories here
repositories {
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "henkelmax.public"
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/maven/'
    }
    flatDir {
        dirs 'libs'
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers are automatically detected from 'META-INF/accesstransformer.cfg'
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')


    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            
            // Add Mixin debug properties
            systemProperty "mixin.config", "soundattract.mixins.json"
            systemProperty "mixin.env.remapRefMap", "true"
            systemProperty "mixin.debug.verbose", "true"
            systemProperty "mixin.debug.export", "true"
            systemProperty "mixin.debug.verify", "true"
            systemProperty "mixin.debug.countInjections", "true"
            systemProperty "mixin.checks", "true"
            systemProperty "mixin.dumpTargetOnFailure", "true"
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            
            // Add Mixin debug properties
            systemProperty "mixin.config", "soundattract.mixins.json"
            systemProperty "mixin.env.remapRefMap", "true"
            systemProperty "mixin.debug.verbose", "true"
            systemProperty "mixin.debug.export", "true"
            systemProperty "mixin.debug.verify", "true"
            systemProperty "mixin.debug.countInjections", "true"
            systemProperty "mixin.checks", "true"
            systemProperty "mixin.dumpTargetOnFailure", "true"
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional dependency for Simple Voice Chat
    // The API is used for compiling your code against.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:neoforge-1.20.1-2.5.30"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.5.31"
    compileOnly files('libs/tacz-neoforge-1.21.1-1.1.6-hotfix-r4.jar')
    // The full mod is added to localRuntime for testing in the development environment.
    // This makes it an optional dependency that isn't bundled or required by your mod.
    localRuntime "curse.maven:simple-voice-chat-416089:6439546"
    
    // The mixin annotation processor is no longer needed; it's handled by NeoGradle.
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}