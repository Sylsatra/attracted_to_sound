plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

group = "${maven_group}"
version = "${mod_version}"
archivesBaseName = "${archives_base_name}"

repositories {
    // This is the NEW, CORRECT repository for Cardinal Components API
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
    // This is the correct repository for Puzzles Lib and Forge Config API Port
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "plasmoverse-releases"
        url = "https://repo.plasmoverse.com/releases"
    }
    // This is for your local Tacz jar
    flatDir {
        dirs 'libs'
    }

    // These are standard and should be kept
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.maxhenkel.de/repository/public" }
}
dependencies {
    // ── 1) Minecraft + Yarn mappings ───────────────────────────────────────────
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings  "net.fabricmc:yarn:1.20.1+build.10:v2"

    // ── 2) Fabric Loader + Fabric API ────────────────────────────────────────
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.5+1.20.1"
    constraints {
        implementation("net.fabricmc.fabric-api:fabric-sound-api-v1:1.0.18+fce6070377") {
            because "Ensure compatibility with Fabric API 0.92.5+1.20.1"
        }
    }

    // ── 3) Voice-chat integration (if you’re using it) ─────────────────────────
    modCompileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-${voicechat_version}"
    modCompileOnly "su.plo.voice.api:server:2.1.5"
    modCompileOnly "su.plo.voice.api:client:2.1.5"
    modImplementation files('libs/pointblank-fabric-1.20.1-1.9.6.jar')
    modImplementation files('libs/geckolib-fabric-1.20.1-4.7.3.jar')
}
// ── 3) Inject the version‐string into fabric.mod.json ────────────────────────
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// ── 4) Compile and target Java 17 bytecode ──────────────────────────────────
java { 
 
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// ── 5) Include LICENSE in the JAR ──────────────────────────────────────────
jar {
    inputs.property "archivesName", project.archivesBaseName
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// ── 6) (Optional) Publishing block ─────────────────────────────────────────
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archivesBaseName
            from components.java
        }
    }
    repositories {
        // configure your Maven repo here if needed
    }
}