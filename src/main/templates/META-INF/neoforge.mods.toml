modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

logoFile="attract-to-sound-mod-logo.jpg"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="soundattract.pointblank.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required" 
    versionRange="[${neo_version},)" 
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required" 
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="voicechat"
    type="optional" 
    versionRange="[1.21.1-2.5.30,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="plasmovoice"
    type="optional"
    versionRange="[2.0.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="pointblank"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tacz" 
    type="optional"
    versionRange="[1.1.6-hotfix-r4,)" 
    ordering="NONE"
    side="BOTH"